<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght,YOPQ@100..900,300&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">

  <title>Frontend Mentor | E-commerce product page</title>
</head>
<body>

<header class="header">
  <div class="header-left">
    <button id="menu-btn">
      <img height="20px" width="20px" src="./images/icon-menu.svg" alt="">
    </button>
    <a href="#home" class="logo">
      <img src="./images/logo.svg" alt="">
    </a>
  
    <nav class="navbar">
      <a href="">Collections</a>
      <a href="">Men</a>
      <a href="">Women</a>
      <a href="">About</a>
      <a href="">Contact</a>
    </nav>
  </div>

  <div class="header-right">
    <button class="cart-btn" type="button">
      <svg class="cart-icon-header" xmlns="http://www.w3.org/2000/svg" width="24" height="24"><path d="M20.925 3.641H3.863L3.61.816A.896.896 0 0 0 2.717 0H.897a.896.896 0 1 0 0 1.792h1l1.031 11.483c.073.828.52 1.726 1.291 2.336C2.83 17.385 4.099 20 6.359 20c1.875 0 3.197-1.87 2.554-3.642h4.905c-.642 1.77.677 3.642 2.555 3.642a2.72 2.72 0 0 0 2.717-2.717 2.72 2.72 0 0 0-2.717-2.717H6.365c-.681 0-1.274-.41-1.53-1.009l14.321-.842a.896.896 0 0 0 .817-.677l1.821-7.283a.897.897 0 0 0-.87-1.114ZM6.358 18.208a.926.926 0 0 1 0-1.85.926.926 0 0 1 0 1.85Zm10.015 0a.926.926 0 0 1 0-1.85.926.926 0 0 1 0 1.85Zm2.021-7.243-13.8.81-.57-6.341h15.753l-1.383 5.53Z" fill="#69707D" fill-rule="nonzero"/></svg>
    </button>
    <img src="./images/image-avatar.png" alt="" class="avatar">
  </div>
</header>

<hr class="headerline">
  
<section>
  <div class="container">
    <div class="even-columns">
      <div class="left-side">
        <div class="box" style="grid-area: box-1;">
          <img src="./images/image-product-1.jpg" alt="">
        </div>
        <div class="box" style="grid-area: box-2;">
          <img src="./images/image-product-1.jpg" alt="">
        </div>
        <div class="box" style="grid-area: box-3;">
          <img src="./images/image-product-2.jpg" alt="">
        </div>
        <div class="box" style="grid-area: box-4;">
          <img src="./images/image-product-3.jpg" alt="">
        </div>
        <div class="box" style="grid-area: box-5;">
          <img src="./images/image-product-4.jpg" alt="">
        </div>
      </div>
  
      <div class="right-column">
        <h3 class="company-name">SNEAKER COMPANY</h3>
        <h1 class="item-name">Fall Limited Edition Sneakers</h1>
        <p class="item-description">
          These low-profile sneakers are your perfect casual wear companion. Featuring a 
          durable rubber outer sole, they’ll withstand everything the weather can offer.
        </p>
        <div class="mobile-price">
          <div class="item-price">
            <h1>$125.00</h1>
            <div class="discount">50%</div>
          </div>
          <div class="pbd-mobile"> 
            <h4 class="price-before-discount"><del>$250.00</del></h4>
          </div>
        </div>
        <div class="item-btns">
          <div class="item-quantity">
            <button class="plus-minus-btn" type="button">
              <img src="./images/icon-minus.svg" alt="">
            </button>
            <span id="item-quantity-id">0</span>
            <button class="plus-minus-btn" type="button">
              <img src="./images/icon-plus.svg" alt="">
            </button>
          </div>
          <button class="add-to-cart" type="button">
            <div class="add-to-cart-inside">
              <svg class="cart-icon-btn" xmlns="http://www.w3.org/2000/svg" width="24" height="24"><path d="M20.925 3.641H3.863L3.61.816A.896.896 0 0 0 2.717 0H.897a.896.896 0 1 0 0 1.792h1l1.031 11.483c.073.828.52 1.726 1.291 2.336C2.83 17.385 4.099 20 6.359 20c1.875 0 3.197-1.87 2.554-3.642h4.905c-.642 1.77.677 3.642 2.555 3.642a2.72 2.72 0 0 0 2.717-2.717 2.72 2.72 0 0 0-2.717-2.717H6.365c-.681 0-1.274-.41-1.53-1.009l14.321-.842a.896.896 0 0 0 .817-.677l1.821-7.283a.897.897 0 0 0-.87-1.114ZM6.358 18.208a.926.926 0 0 1 0-1.85.926.926 0 0 1 0 1.85Zm10.015 0a.926.926 0 0 1 0-1.85.926.926 0 0 1 0 1.85Zm2.021-7.243-13.8.81-.57-6.341h15.753l-1.383 5.53Z" fill-rule="nonzero"/></svg>
              Add to cart
            </div>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
<script src="main.js"></script>
</body>
</html>
